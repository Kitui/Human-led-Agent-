name: Deploy Azure

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production-deploy
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-human-led-agent-prod
  AZURE_CONTAINER_APP: human-led-agent
  ACR_NAME: humanledagentacr
  ACR_LOGIN_SUFFIX: cvayfpbeg0b2ewem
  ACR_LOGIN_SERVER: humanledagentacr-cvayfpbeg0b2ewem.azurecr.io
  IMAGE_NAME: human-led-agent

jobs:
  deploy:
    # Deploy only a successful CI run caused by a push to main. Manual dispatch
    # remains available for an intentional redeploy of the current main commit.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Resolve tested commit
        id: revision
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.revision.outputs.sha }}

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Build and push immutable image
        shell: bash
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ steps.revision.outputs.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          # The deploy identity intentionally has only AcrPush on ACR, not ACR
          # control-plane management. Supplying the login suffix lets Azure CLI
          # authenticate directly to the registry's tenant-scoped login server
          # without requiring registry management permissions.
          az acr login --name "$ACR_NAME" --suffix "$ACR_LOGIN_SUFFIX"
          docker build --pull --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy image to Azure Container Apps
        run: |
          az containerapp update \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE" \
            --output none

      - name: Verify production health
        shell: bash
        run: |
          FQDN=$(az containerapp show \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          echo "Production URL: https://$FQDN"

          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 10 "https://$FQDN/health"; then
              echo
              echo "Deployment health check passed."
              {
                echo "### Azure production deployment"
                echo "- Commit: \`${{ steps.revision.outputs.sha }}\`"
                echo "- Image: \`$IMAGE\`"
                echo "- URL: https://$FQDN"
                echo "- Health: passed"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Health check attempt $attempt/18 failed; retrying in 10 seconds..."
            sleep 10
          done

          echo "Production health check failed after deployment."
          az containerapp revision list \
            --name "$AZURE_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[].{Name:name,Active:properties.active,Health:properties.healthState,Created:properties.createdTime}" \
            --output table || true
          exit 1
