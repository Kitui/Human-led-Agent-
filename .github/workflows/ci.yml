name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent_lab
          POSTGRES_PASSWORD: agent_lab
          POSTGRES_DB: agent_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_lab -d agent_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://agent_lab:agent_lab@localhost:5432/agent_lab
      BROWSER_DATABASE_URL: postgresql+asyncpg://agent_lab:agent_lab@localhost:5432/agent_lab_ui
      # Only used to sign/verify tokens within this CI run itself -- not a
      # real credential, so a plain committed value is fine here (unlike
      # OPENAI_API_KEY below, which is a real secret). Keep it >=32 bytes.
      JWT_SECRET_KEY: ci-test-secret-not-for-real-use-32-bytes-minimum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The public-release audit scans all reachable historical blobs, so
          # CI must fetch the complete repository history rather than one SHA.
          fetch-depth: 0

      - name: Audit repository history for committed secrets
        run: python scripts/security_audit.py

      - name: Build production container
        run: docker build --tag human-led-agent:ci .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip check

      - name: Run unit tests
        run: pytest

      # Browser rendering is intentionally isolated from the primary CI database.
      # Starting the full production app seeds demo/reference state, so using a
      # dedicated database guarantees the UI gate cannot affect the later live
      # AI evaluation suite or its persisted history.
      - name: Create isolated browser test database
        run: |
          python - <<'PY'
          import asyncio
          import asyncpg

          async def main():
              conn = await asyncpg.connect(
                  host="127.0.0.1",
                  port=5432,
                  user="agent_lab",
                  password="agent_lab",
                  database="postgres",
              )
              try:
                  await conn.execute("DROP DATABASE IF EXISTS agent_lab_ui WITH (FORCE)")
                  await conn.execute("CREATE DATABASE agent_lab_ui")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      # PRs render the real production container in Chromium before merge.
      # This catches layout regressions and verifies the anonymous/public route
      # separately from the authenticated application boundary.
      - name: Start production container for browser checks
        shell: bash
        run: |
          docker run --detach \
            --name correlact-ui-ci \
            --network host \
            --env DATABASE_URL="$BROWSER_DATABASE_URL" \
            --env JWT_SECRET_KEY="$JWT_SECRET_KEY" \
            --env ENABLE_DEMO_USERS=true \
            --env DEMO_NORTHSTAR_PASSWORD=northstar-browser-test-pass \
            --env DEMO_NEPTUNE_PASSWORD=neptune-browser-test-pass \
            --env DEMO_ADMIN_PASSWORD=admin-browser-test-pass \
            human-led-agent:ci

          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/health >/dev/null; then
              echo "Browser-test app is healthy."
              exit 0
            fi
            sleep 2
          done

          echo "Browser-test app failed to become healthy."
          docker logs correlact-ui-ci || true
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium browser test runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run rendered browser checks
        env:
          CORRELACT_BASE_URL: http://127.0.0.1:8000
        run: npx playwright test tests/browser --reporter=line

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop browser-test container
        if: always()
        run: docker rm --force correlact-ui-ci || true

      - name: Run AI evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python evals/evals.py
