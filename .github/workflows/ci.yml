name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent_lab
          POSTGRES_PASSWORD: agent_lab
          POSTGRES_DB: agent_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_lab -d agent_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://agent_lab:agent_lab@localhost:5432/agent_lab
      # Only used to sign/verify tokens within this CI run itself -- not a
      # real credential, so a plain committed value is fine here (unlike
      # OPENAI_API_KEY below, which is a real secret). Keep it >=32 bytes.
      JWT_SECRET_KEY: ci-test-secret-not-for-real-use-32-bytes-minimum

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The public-release audit scans all reachable historical blobs, so
          # CI must fetch the complete repository history rather than one SHA.
          fetch-depth: 0

      - name: Audit repository history for committed secrets
        run: python scripts/security_audit.py

      - name: Build production container
        run: docker build --tag human-led-agent:ci .

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip check

      - name: Run unit tests
        run: pytest

      - name: Run AI evaluation suite
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python evals/evals.py
