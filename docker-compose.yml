services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_lab
      POSTGRES_PASSWORD: agent_lab
      POSTGRES_DB: agent_lab
    ports:
      # Host port 5544 (not the default 5432) to avoid clashing with any
      # other Postgres already running on your machine outside Docker.
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_lab -d agent_lab"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
